<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
    rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
    crossorigin="anonymous"/>

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.0/css/all.min.css"
      integrity="sha512-DxV+EoADOkOygM4IR9yXP8Sb2qwgidEmeqAEmDKIOfPRQZOWbXCzLC6vjbZyy0vPisbH2SyW27+ddLVCN+OMzQ=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />


    <link rel="stylesheet" href="./style.css">
</head>
<body>

    <div class="container" id="main">
       <div class="container" id="container" >
            <h1 class="display-1 text-light mb-2" >TASK <i class="fa-solid fa-chart-pie"></i>  MANAGER</h1>
            <div class="alert alert-secondary text-center" role="alert">Balance</div>
       </div>
       <!-- FORMULARIO -->
        <div class="container" id="formulario">
            <div class="form-floating col-5">
                <input type="text" class="form-control" id="description" placeholder="description">
                <label for="description">Description</label>
            </div>
            <div class="form-floating col-5">
                <input type="date" class="form-control" id="date" placeholder="date">
                <label for="date">Deadline: </label>
            </div>
            <div class="col-2">
               <button class="btn btn-primary w-100" onclick="addNewTask()"> Add Task</button>
            </div>
            <label for="" id="selected"></label>
        </div>
       <div class="container" id="controls">
        <!-- TO FILTER -->
            <button type="button" class="btn btn-outline-primary" onclick="orderById()">ORDER ID</button>
            <button type="button" class="btn btn-outline-warning" onclick="orderByDate()">ORDER BY DATE</button>
            <button type="button" class="btn btn-outline-success" onclick="completeTask()">STATUS COMPLETED</button>
            <button type="button" class="btn btn-outline-warning" onclick="ALL()">ALL TASKS</button>
            <button type="button" class="btn btn-outline-danger" onclick="canceled_tasks()">STATUS CANCELED</button>
       </div>
       <div class="container" id="table_result" >
           <!-- TABLE START -->
          <table class="table table table-hover col" >
             <thead>
                <tr>
                    <th scope="col-1">ID</th>
                    <th scope="col-5">Description</th>
                    <th scope="col-4">Date</th>
                    <th scope="col">Status</th>
                    <th scope="col"></th>
                    <th scope="col"></th>
                </tr>
             </thead>
             <tbody class="table-group-divider" id="result">
               <!-- table rows -->
              </tbody>
       </table>
  <!-- TABLE END -->

       </div>
        
    </div>
    
   
    <script type="module" src="./script.js"></script>
</body>
</html>
